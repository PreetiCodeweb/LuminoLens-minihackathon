<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up — LuminoLens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="flex flex-col min-h-screen bg-[var(--color-1)]">
  <header class="w-full bg-[var(--color-5)] py-4 px-6">
    <a href="index.html" class="text-2xl font-bold text-white">LuminoLens</a>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md text-[var(--color-5)]">
      <h1 class="text-3xl font-bold mb-1">Create your account</h1>
      <p class="text-sm text-[var(--color-4)] mb-6">Get personalized frame matches and track your orders.</p>

      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Full name</label>
          <input type="text" id="name" required class="form-input" placeholder="Jane Doe" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Email</label>
          <input type="email" id="email" required class="form-input" placeholder="you@example.com" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password</label>
          <input type="password" id="password" required minlength="6" class="form-input" placeholder="At least 6 characters" />
        </div>
        <button type="submit" class="btn-primary w-full">Sign Up</button>
      </form>

      <p class="text-sm text-center mt-6">Already have an account? <a href="login.html" class="font-semibold underline">Log in</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        const { token, user } = await api("/auth/register", { method: "POST", body: { name, email, password } });
        Auth.setSession(token, user);
        showToast(`Welcome to LuminoLens, ${user.name.split(" ")[0]}!`);
        setTimeout(() => (window.location.href = "index.html"), 500);
      } catch (err) {
        showToast(err.message, "error");
      }
    });
  </script>
</body>
</html>
